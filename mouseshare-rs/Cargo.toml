[package]
name = "mouseshare"
version = "0.1.0"
edition = "2021"
description = "Cross-platform keyboard, mouse and clipboard sharing over LAN"

[[bin]]
name = "mouseshare"
path = "src/main.rs"

[dependencies]
arboard = "3"
muda = "0.16"
rcgen = { version = "0.13", features = ["crypto", "ring"] }
rdev = { version = "0.5", features = ["serialize"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tray-icon = "0.20"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
